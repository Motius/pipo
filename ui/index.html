<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipo — Your Company Workflow Brain</title>
  <link rel="icon" type="image/png" href="./public/assets/pipo-agent-icon.png" />
  <link rel="apple-touch-icon" href="./public/assets/pipo-agent-icon.png" />
  <script>
        /* Theme bootstrap — set before paint to avoid a flash. Premium dark
           graphite is the default; an explicit light choice remains available. */
    (function () {
      try {
        var t = localStorage.getItem('pipo-theme');
        if (t !== 'light' && t !== 'dark') {
          t = 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles/globals.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
