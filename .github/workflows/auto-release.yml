name: Auto Release

# Automatically bumps the patch version (odometer-style: 4.0.9 -> 4.1.0 ->
# 4.9.9 -> 5.0.0) and cuts a GitHub Release on every push to main, so each
# push produces a new release version number.
#
# The version-bump commit carries `[skip ci]` so this workflow does not
# re-trigger itself (which would otherwise loop forever).
#
# After tagging, this workflow DISPATCHES release-exec.yml on the new tag.
# The dispatch is what actually publishes: npm packages (@pipo/brain, the
# @pipo/sidecar-* family), Docker images, and the signed-installers GitHub
# release all live in release-exec.yml. Without it, the [skip ci] on the
# bump commit also suppresses release-exec's own v* tag-push trigger, so the
# tag landed but nothing was ever published (the npm 404 on `bun install -g
# @pipo/brain`). A dispatch is exempt from [skip ci] and starts the release
# with the exact ref the workflow demands: validate-tag rejects a real run
# whose ref is not the tag itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # Skip the auto-bump commit itself (belt and suspenders on top of [skip ci]).
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'release v')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
          no-cache: true

      - name: Compute next version (odometer carry-over)
        id: version
        run: |
          set -euo pipefail
          CURRENT=$(jq -r .version package.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          # Patch rolls over at 9 -> 0, carrying into minor; minor rolls over
          # at 9 -> 0, carrying into major. (4.0.9 -> 4.1.0, 4.9.9 -> 5.0.0)
          if [ "$PATCH" -lt 9 ]; then
            PATCH=$((PATCH + 1))
          else
            PATCH=0
            if [ "$MINOR" -lt 9 ]; then
              MINOR=$((MINOR + 1))
            else
              MINOR=0
              MAJOR=$((MAJOR + 1))
            fi
          fi
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "CURRENT=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "NEW=${NEW}" >> "$GITHUB_OUTPUT"
          echo "Version bump: ${CURRENT} -> ${NEW}"

      - name: Guard - tag must not already exist
        env:
          NEW: ${{ steps.version.outputs.NEW }}
        run: |
          set -euo pipefail
          if git rev-parse "v${NEW}" >/dev/null 2>&1; then
            echo "Tag v${NEW} already exists locally; aborting."
            exit 1
          fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/v${NEW}" >/dev/null 2>&1; then
            echo "Tag v${NEW} already exists on remote; aborting."
            exit 1
          fi

      - name: Bump package.json
        env:
          NEW: ${{ steps.version.outputs.NEW }}
        run: |
          set -euo pipefail
          npm version "$NEW" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "release v${NEW} [skip ci]"
          git push origin main
          git tag "v${NEW}"
          git push origin "v${NEW}"

      - name: Create GitHub Release
        env:
          NEW: ${{ steps.version.outputs.NEW }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "v${NEW}" \
            --title "v${NEW}" \
            --notes "Auto-release v${NEW}." \
            --latest

      # Publish for real: run the release pipeline against the tag we just
      # pushed. dry_run must be explicitly false (its default is true), and
      # the run must be dispatched ON the tag -- validate-tag fails a real
      # release whose ref is not the tag it names.
      - name: Dispatch the release pipeline
        env:
          NEW: ${{ steps.version.outputs.NEW }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run release-exec.yml \
            --repo "${{ github.repository }}" \
            --ref "v${NEW}" \
            -f "tag=v${NEW}" \
            -f "dry_run=false"
          echo "Dispatched release-exec.yml for v${NEW} (dry_run=false)."